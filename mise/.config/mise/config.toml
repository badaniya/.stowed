[tools]
node = "24"
# mermaid-cli renders diagrams through puppeteer; we reuse the host Chrome below
# instead of letting puppeteer download its own copy (~180 MB).
# chromium-bidi is Google's Chrome-versioned CDP lib; this release ships without
# provenance attestation, which mise's npm backend flags as a trust downgrade.
"npm:@mermaid-js/mermaid-cli" = { version = "12.2.0", trust_policy_excludes = ["chromium-bidi@157.0.8090-0"] }
# ImageMagick converts images/diagrams for nvim (snacks.image). The aqua and AppImage
# builds ship without librsvg, which breaks mermaid SVG -> PNG; the conda build keeps
# full delegates (RSVG, ghostscript, libheif, libwebp).
# prefix.dev mirrors conda-forge; Anaconda connections reset on this host.
"conda:imagemagick" = { version = "7.1.2_31", channel = "https://prefix.dev/conda-forge" }

# --- system CLIs: mise owns these so a single tool tracks and upgrades them all ---
"aqua:atuinsh/atuin" = "18.4.0"
"aqua:aristocratos/btop" = "1.4.0"
"core:bun" = "1.1.20"
"aqua:carapace-sh/carapace-bin" = "1.0.6"
"aqua:wagoodman/dive" = "0.12.0"
"aqua:sharkdp/fd" = "10.1.0"
"aqua:dundee/gdu" = "5.29.0"
"aqua:cli/cli" = "2.96.0"
"aqua:PaulJuliusMartinez/jless" = "0.9.0"
"aqua:mike-engel/jwt-cli" = "6.2.0"
# Match the Kubernetes ktop previously installed by Nix (ynqa/kTOP is a different tool).
"github:vladimirvivien/ktop" = { version = "0.3.7", matching = "ktop" }
# niche tool (311 weekly downloads) below mise's 1000/week supply-chain threshold;
# verified as the official mistweaverco/kulala-fmt package on registry.npmjs.org
"npm:@mistweaverco/kulala-fmt" = { version = "4.5.3", allow_low_downloads = true }
"aqua:jesseduffield/lazydocker" = "0.23.3"
"aqua:jesseduffield/lazygit" = "0.55.1"
"aqua:tstack/lnav" = "0.12.2"
"aqua:nushell/nushell" = "0.97.1"
"github:jgm/pandoc" = "3.1.11.1"
"github:tectonic-typesetting/tectonic" = "0.17.0"
# tmux-builds ships 3.6a+ only; pinned to the newest release
"aqua:tmux/tmux-builds" = "3.8"
"ubi:fcsonline/tmux-thumbs" = "0.8.0"
# rust replaces nix's cargo; tmuxinator is a gem and needs ruby
rust = "stable"
ruby = "4.0.9"
"gem:tmuxinator" = "3.4.2"
# pls ships prereleases only, so the tag has to be pinned manually (ls-remote hides them)
"github:pls-rs/pls" = "7.0.0-beta.1"
fzf = "0.75.0"

# Additional tools preserved when migrating the other host's Nix profile.
"github:orhun/binsider" = "0.1.0"
"aqua:dandavison/delta" = "0.19.2"
"aqua:dlvhdr/diffnav" = "0.3.1"
"aqua:gitui-org/gitui" = "0.27.0"
"aqua:charmbracelet/glow" = "2.1.1"
"aqua:pemistahl/grex" = "1.4.5"
"aqua:helmfile/helmfile" = "1.1.7"
"aqua:blacknon/hwatch" = "0.3.15"
"aqua:sharkdp/hyperfine" = "1.18.0"
"aqua:noahgorstein/jqp" = "0.7.0"
"aqua:kubecolor/kubecolor" = "0.5.2"
"github:zaghaghi/openapi-tui" = "0.10.2"
"aqua:knqyf263/pet" = "1.0.1"
"aqua:pypa/pipx" = "1.7.1"
"github:LucasPickering/slumber" = "3.0.1"
"github:neilotoole/sq" = "0.48.3"
"aqua:abhimanyu003/sttr" = "0.2.23"
# Native packet capture dependency stays with the OS: sudo apt install tshark.
"aqua:gcla/termshark" = "2.4.0"
"github:kxxt/tracexec" = "0.10.0"
"github:medialab/xan" = "0.48.0"
"aqua:ducaale/xh" = "0.22.2"
"aqua:sxyazi/yazi" = "0.3.3"
"aqua:ajeetdsouza/zoxide" = "0.9.4"
# uv supplies isolated Python runtimes for mise's pipx backend.
uv = "0.13.8"
"pipx:httpstat" = "1.3.1"
"pipx:posting" = "2.5.4"

[env]
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/google-chrome"

[tasks.pi-bootstrap]
description = "Install or repair the per-machine managed Pi runtime"
run = "bash \"$HOME/.stowed/scripts/pi-bootstrap.sh\""

[tasks.pi-check]
description = "Verify the managed Pi runtime without changing anything"
run = "bash \"$HOME/.stowed/scripts/pi-bootstrap.sh\" --check"
