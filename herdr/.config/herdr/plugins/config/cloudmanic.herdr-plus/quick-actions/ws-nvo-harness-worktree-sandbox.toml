name = "Open workspace & bootstrap sandbox: NVO-WORKTREE-SANDBOX"
type = "form"
command = "python3 ~/.config/herdr-spreader/herdr-action-errors.py run --name 'Open workspace & bootstrap sandbox: NVO-WORKTREE-SANDBOX' -- bash ~/.config/herdr-spreader/nvo-harness-worktree-sandbox-notify.sh '{{.Value}}'"

[form]
