# herdr-sandbox-exposure AppArmor extension v1
# Include from local/sbin.dhclient; keep the daemon and its hook confined.
owner /var/lib/herdr-sandbox-exposure/xiqfwd[0-9]*.dhcp/dhclient.conf r,
owner /var/lib/herdr-sandbox-exposure/xiqfwd[0-9]*.dhcp/client.pid rw,
owner /var/lib/herdr-sandbox-exposure/xiqfwd[0-9]*.dhcp/client.leases{,~} lrw,
/var/lib/herdr-sandbox-exposure/xiqfwd[0-9]*.dhcp/hook.py rCx -> herdr-exposure-hook-v1,
signal (receive) set=chld peer=@{profile_name}//herdr-exposure-hook-v1,

profile herdr-exposure-hook-v1 flags=(attach_disconnected) {
  #include <abstractions/base>
  #include <abstractions/python>

  /{,usr/}bin/python3{,.[0-9]*} rix,
  /{,usr/}{bin,sbin}/ip rix,
  /etc/iproute2/{group,rt_scopes} r,
  /var/lib/herdr-sandbox-exposure/xiqfwd[0-9]*.dhcp/hook.py r,
  /var/lib/herdr-sandbox-exposure/xiqfwd[0-9]*.dhcp/ r,
  owner /var/lib/herdr-sandbox-exposure/xiqfwd[0-9]*.dhcp/ack.json rw,

  capability net_admin,
  network netlink raw,
  network netlink dgram,
  signal (send) set=chld,
}
